<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t d">
<title id="t">Newton-informed neural operator</title><desc id="d">The neural operator maps a current state to its next state. A Newton linearization residual supplies a training loss; the learned map is iterated at inference.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="#197596"/></marker></defs>
<rect width="720" height="360" rx="18" fill="#f3f8fb"/>
<text x="26" y="32" fill="#385970" font-family="Arial" font-size="16" font-weight="bold">LEARNED NEWTON MAP</text>
<rect x="30" y="78" width="135" height="84" rx="12" fill="#fff" stroke="#a3c7d7" stroke-width="2"/>
<text x="97" y="110" text-anchor="middle" font-family="Arial" font-size="16" fill="#37536a">Current state</text><text x="97" y="143" text-anchor="middle" font-family="Georgia" font-size="26" fill="#164961">uₖ</text>
<path d="M165 120H205" stroke="#197596" stroke-width="3" marker-end="url(#a)"/>
<rect x="210" y="67" width="224" height="106" rx="15" fill="#176f8f"/>
<text x="322" y="108" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="white">Neural operator</text><text x="322" y="143" text-anchor="middle" font-family="Georgia" font-size="24" fill="#d3f1f7">uₖ₊₁ = Gθ(uₖ)</text>
<path d="M434 120H475" stroke="#197596" stroke-width="3" marker-end="url(#a)"/>
<rect x="480" y="78" width="200" height="84" rx="12" fill="#fff" stroke="#a3c7d7" stroke-width="2"/><text x="580" y="110" text-anchor="middle" font-family="Arial" font-size="16" fill="#37536a">Updated state</text><text x="580" y="143" text-anchor="middle" font-family="Georgia" font-size="26" fill="#164961">uₖ₊₁</text>
<path d="M580 163 V202 H97 V165" fill="none" stroke="#20a086" stroke-width="2.5" marker-end="url(#a)"/><text x="338" y="195" text-anchor="middle" font-family="Arial" font-size="13" fill="#188571">repeat at inference</text>
<path d="M322 174 V226" stroke="#cd8550" stroke-width="2.5" stroke-dasharray="5 4"/>
<rect x="67" y="231" width="586" height="99" rx="13" fill="#fff7ed" stroke="#efc59d" stroke-width="2"/><text x="360" y="257" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#a45e2b">NEWTON-INFORMED TRAINING</text><text x="360" y="287" text-anchor="middle" font-family="Georgia" font-size="21" fill="#5e4635">F′(uₖ)(uₖ₊₁ − uₖ) + F(uₖ) ≈ 0</text><text x="360" y="313" text-anchor="middle" font-family="Arial" font-size="13" fill="#836951">Linearized PDE residual guides the learned update</text></svg>