<title id="title">Local detail. Global coupling.</title><desc id="desc">A learnable multigrid V-cycle descends from fine to coarse grids by restriction and returns by prolongation and correction. MgNO uses this structure to parameterize linear operators.</desc>
<!-- Source: He, Liu, Xu. MgNO, ICLR 2024, arXiv:2310.19809. -->
