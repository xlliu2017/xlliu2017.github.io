<svg xmlns="http://www.w3.org/2000/svg" width="480" height="280" viewBox="0 0 480 280" role="img" aria-labelledby="title desc">
<title id="title">More depth. Same backbone.</title>
<desc id="desc">Lift the input with L, compose the shared backbone G theta n times, and project with P. Train-and-Unroll progressively grows the explicit composition depth. A conceptual diagram, not a residual-driven online solver.</desc>
<!-- Source: He, Liu, Xu. JCP 2026, doi:10.1016/j.jcp.2026.115189. -->
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#65737b" stroke-width="1.5"/></marker></defs>
<rect x="1" y="1" width="478" height="278" rx="8" fill="#f8fbfc" stroke="#e5ecef"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#263b47" text-anchor="middle">
<text x="240" y="40" font-size="28" font-weight="700">More depth. Same backbone.</text>
<text x="240" y="72" font-size="20" fill="#647680">One learned block, applied repeatedly</text>
<g stroke="#0d98ba" fill="#e4f4f8"><rect x="87" y="99" width="70" height="55" rx="5"/><rect x="181" y="99" width="70" height="55" rx="5"/><rect x="308" y="99" width="70" height="55" rx="5"/></g>
<g font-size="25"><text x="34" y="133">L</text><text x="122" y="133">G<tspan font-size="17">θ</tspan></text><text x="216" y="133">G<tspan font-size="17">θ</tspan></text><text x="279" y="133">···</text><text x="343" y="133">G<tspan font-size="17">θ</tspan></text><text x="438" y="133">P</text></g>
<g stroke="#65737b" stroke-width="2" marker-end="url(#a)"><path d="M51 126H80"/><path d="M158 126H173"/><path d="M252 126H262"/><path d="M293 126H302"/><path d="M380 126H413"/></g>
<path d="M87 163V174H378V163" stroke="#0d98ba" fill="none" stroke-width="1.5"/>
<text x="240" y="198" font-size="21" fill="#0b819e">Shared weights across all n compositions</text>
<path d="M20 216H460" stroke="#dae5e9"/>
<text x="240" y="249" font-size="21">Train-and-Unroll: grow depth 1 → 2 → ···</text>
</g></svg>
